<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" role="img" aria-labelledby="ledger-title ledger-desc" data-theme="light" data-layout="desktop">
<title id="ledger-title">Public proof ledger</title>
<desc id="ledger-desc">Live status of 0 Lean Pool contributions. Each row separates claim scope, Lean build checks, automated editorial review, formal human review, and pull request state.</desc>
<rect width="1200" height="284" rx="12" fill="#f6f8fa"/>
<text x="32" y="34" fill="#326d4d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">PUBLIC FORMAL WORK</text>
<text x="32" y="68" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" text-anchor="start">Proof ledger</text>
<text x="32" y="94" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="400" text-anchor="start">Data through 2026-10-07 11:03 UTC</text>
<text x="1168" y="68" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="400" text-anchor="end">GitHub + Vilin97/lean-pool</text>
<rect x="20" y="116" width="1160" height="54" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="34" y="148" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.9">CONTRIBUTION</text>
<text x="430" y="148" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.9">SCOPE</text>
<text x="630" y="148" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.9">LEAN BUILD</text>
<text x="772" y="148" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.9">AUTO REVIEW</text>
<text x="920" y="148" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.9">HUMAN REVIEW</text>
<text x="1080" y="148" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.9">STATE</text>
<line x1="20" y1="164" x2="1180" y2="164" stroke="#d0d7de"/>
<text x="32" y="200" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">PASS means the current PR revision completed the Lean Pool build checks reported by GitHub.</text>
<text x="32" y="222" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">AUTO REVIEW is the repository&#x27;s automated editorial verdict. HUMAN REVIEW counts formal GitHub reviews.</text>
<text x="32" y="244" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">CONDITIONAL marks a theorem checked after assuming named published inputs. Lean does not check those inputs here.</text>
<text x="32" y="266" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">SCOPE PENDING is the conservative default for a newly discovered PR until its claim boundary is classified.</text>
</svg>
