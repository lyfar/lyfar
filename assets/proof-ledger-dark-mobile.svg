<svg xmlns="http://www.w3.org/2000/svg" width="480" height="226" viewBox="0 0 480 226" role="img" aria-labelledby="ledger-title ledger-desc" data-theme="dark" data-layout="mobile">
<title id="ledger-title">Public proof ledger</title>
<desc id="ledger-desc">Live status of 0 Lean Pool contributions. Each row separates claim scope, Lean build checks, automated editorial review, formal human review, and pull request state.</desc>
<rect width="480" height="226" rx="12" fill="#0d1117"/>
<text x="24" y="34" fill="#4b8e66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">PUBLIC FORMAL WORK</text>
<text x="24" y="68" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" text-anchor="start">Proof ledger</text>
<text x="24" y="94" fill="#a8b1bb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="400" text-anchor="start">Data through 2026-10-10 10:36 UTC</text>
<text x="20" y="134" fill="#a8b1bb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">Lean build, automated review, human review, and PR state stay separate.</text>
<text x="20" y="156" fill="#a8b1bb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">CONDITIONAL means the proof depends on named published inputs.</text>
<text x="20" y="178" fill="#a8b1bb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">SCOPE PENDING is the default for a newly discovered pull request.</text>
<text x="20" y="200" fill="#a8b1bb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">Source: public GitHub API and Vilin97/lean-pool.</text>
</svg>
